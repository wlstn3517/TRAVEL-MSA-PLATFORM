########################################################
# Auth Service configuration
########################################################

spring.application.name=auth-service

# Google OAuth Client ID
# Used to verify that the token was issued for this application
google.client-id=YOUR_GOOGLE_CLIENT_ID

########################################################
# JWT configuration
########################################################

# Secret key used to sign JWT access tokens
jwt.secret=YOUR_JWT_SECRET

# Access token expiration time
# 3600000 ms = 1 hour
jwt.access-token-expire-ms=3600000

########################################################
# Server port
########################################################

server.port=8081

########################################################
# MyBatis configuration
########################################################

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

########################################################
# Database configuration
########################################################

spring.datasource.url=jdbc:mariadb://localhost:3306/travel?useUnicode=true&characterEncoding=utf8
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

########################################################
# Eureka client configuration
########################################################

eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

########################################################
# Logging configuration
########################################################

# Spring Security debug logs
logging.level.org.springframework.security=DEBUG

# Security filter chain logs
logging.level.org.springframework.security.web=DEBUG

# Authentication process logs
logging.level.org.springframework.security.authentication=DEBUG