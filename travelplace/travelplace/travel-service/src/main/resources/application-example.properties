# Service name
# Used by gateway to identify this service
spring.application.name=travel-service

# JWT secret key
# Used to sign access tokens
jwt.secret=YOUR_JWT_SECRET

# Server port
# Avoid conflict with auth and gateway services
server.port=8082


# MariaDB connection
spring.datasource.url=jdbc:mariadb://localhost:3306/travel
spring.datasource.username=DB_USERNAME
spring.datasource.password=DB_PASSWORD
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# MyBatis mapper location
mybatis.mapper-locations=classpath:mapper/*.xml

# Enable camel case mapping
mybatis.configuration.map-underscore-to-camel-case=true


# Actuator endpoints
management.endpoints.web.exposure.include=health,info


# Logging level
logging.level.root=INFO


# Eureka client configuration
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


# MyBatis type alias package
mybatis.type-aliases-package=com.travel.travel