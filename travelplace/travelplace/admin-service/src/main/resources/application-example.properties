########################################################
# Admin Service configuration
########################################################

# Service name (registered to Eureka)
spring.application.name=admin-service

# Server port
# auth:8081 travel:8082 batch:8083 so admin uses 8084
server.port=8084

########################################################
# JWT configuration
# Must use the same secret as auth-service
########################################################

jwt.secret=YOUR_JWT_SECRET

########################################################
# Eureka Client configuration
########################################################

# Eureka server address
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable Eureka client
eureka.client.enabled=true

# Fetch registry for lb:// routing
eureka.client.fetch-registry=true

# Register admin-service to Eureka
eureka.client.register-with-eureka=true

# Prefer IP address
eureka.instance.prefer-ip-address=true

########################################################
# Actuator endpoints
########################################################

management.endpoints.web.exposure.include=health,info

########################################################
# Logging
########################################################

logging.level.root=INFO